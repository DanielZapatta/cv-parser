# PostgreSQL profile — activate with: --spring.profiles.active=postgres
# Override these via environment variables in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cvtailordb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:cvtailor}
spring.datasource.password=${DB_PASSWORD:cvtailor}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false
