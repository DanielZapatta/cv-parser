spring.application.name=cv-tailor-backend
server.port=8080

# Ollama configuration
ollama.base-url=http://localhost:11434
ollama.default-model=qwen2.5:7b

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- JPA / Hibernate ---
# H2 in-memory database (development default)
spring.datasource.url=jdbc:h2:mem:cvtailordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (accessible at /h2-console during dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.cvtailor=INFO
logging.level.root=WARN
